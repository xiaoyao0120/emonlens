# EmonLens 交付台账（由 AWR 接管后建立，人工可审阅、可编辑）
#
# 来源与依据：
# - docs/EmonLens评测平台迭代方案.md（v1，2026-11-03）定义 R1/R2/R3 三个迭代窗口与验收标准
# - 用户指示（2026-11-03）：在当前分支完成该计划
# - 仓库现状：0.2.0 的 R1 四特性已实现，验收由后端集成测试与 SDK 测试覆盖
#
# 口径提醒：本项目把「结论」当一等对象——COMPLETED ≠ 通过，CI 只消费
# decision=PASS 且 verification.usable=true 的 Gate。台账里的 status 只表达
# 「源文件声明的状态」，完成声明仍需 AWR 的验证报告才能变成 verified_completed。

goals:
  - id: emonlens-eval-platform
    title: 交付可验证的 EmonLens 评测平台迭代（0.2.0 至 0.4.0）
    status: active
    priority: P0
    summary: >-
      按 docs/EmonLens评测平台迭代方案.md 推进三个窗口：R1 评测开发者体验（0.2.0，已交付）、
      R2 在线评估与反馈闭环（0.3.0）、R3 Agent 专项与安全（0.4.0）。每个窗口以 Gate、
      任务账本与 Judge 盲审校准口径的验收证据为准，不以「跑完」代替「通过」。
    success_criteria:
      - R1 四特性全部落地，后端集成测试与 SDK 测试通过（0.2.0）
      - R2 四特性落地，评估规则 v2 提供幂等迁移 SQL（0.3.0）
      - R3 安全评测包与多轮会话仿真落地，security 维度有真实证据来源（0.4.0）
      - 每个窗口结束可执行 make verify 与 make sdk-test

milestones:
  - id: r1-dx
    title: R1 评测开发者体验（0.2.0）
    status: completed
    summary: SDK 自定义评测器、Playground 矩阵与 Diff、Prompt 版本与实验打通、GitHub Action 与 PR 评论。
  - id: r2-online
    title: R2 在线评估与反馈闭环（0.3.0）
    status: in_progress
    summary: 评估规则 v2（已交付）、端用户反馈采集、评估器质量看板、实验对比增强。
  - id: r3-agent
    title: R3 Agent 专项与安全（0.4.0）
    status: ready
    summary: 多轮会话仿真、安全评测包进 Gate、Judge 技术升级、多模态（可延后）。

work_items:
  - id: r1-improve-dx
    title: 交付 0.2.0 评测 DX 四特性
    status: completed
    goal: emonlens-eval-platform
    milestone: r1-dx
    required: true
    priority: P0
    summary: >-
      R1-1 SDK 评测器（push 模式）在本次接管前已实现；R1-2 矩阵与 Diff、R1-3 prompt 版本绑定、
      R1-4 GitHub Action 与 PR 评论在本次迭代实现，版本号统一到 0.2.0。
    acceptance:
      - 矩阵跑完可导出网格 CSV，Diff 结论可追溯到逐样本偏好记录，单格失败不中断整批
      - 从 prompt 版本可反查被哪些 run 评过与 Gate 结论；production 换版后旧 Gate 自动失效
      - PR 评论幂等更新；Gate 非 PASS 时 Action 失败并列出检查项
      - 含 SDK 评测器的 run 与矩阵相关后端集成测试全部通过
    next_action: >-
      用 AWR 的验证报告把已完成的验收固定为 verified_completed（当前只有源声明与测试文件作为参考证据）
    evidence:
      - emonlens-server/src/test/java/io/emonlens/server/PlaygroundMatrixFlowTest.java
      - emonlens-sdk-python/tests/test_ci.py
      - docs/EmonLens评测平台迭代方案.md

  - id: r2-1-rules-v2
    title: 评估规则 v2（scope / filter / 回溯）
    status: completed
    goal: emonlens-eval-platform
    milestone: r2-online
    required: true
    priority: P0
    summary: >-
      全局采样升级为规则对象（scope=TRACE/SESSION、过滤条件、per-rule 采样率与小时预算、错误强制）。
      命中账本 (rule_key, subject_id) 保证幂等与预算计数；一次 trace 完成里多规则按 priority 归并去重；
      SESSION 按空闲阈值对多轮摘录评估一次并独立汇总；Rewind 按游标限速补评、可暂停/恢复/取消。
      没有启用规则的工作空间仍走旧全局采样（向后兼容）。
    acceptance:
      - 同一 trace 命中多条规则时结果可归并去重
      - Rewind 跑完的 trace 不重复评估
      - SESSION 评估在报告中有独立汇总
      - 未配置规则的工作空间行为不变（回退路径可用）
    next_action: >-
      补齐两处已知偏差：SPAN scope 的独立采样口径，以及 Evaluation Monitor 分母随 scope 调整；
      之后进入 R2-2 端用户反馈采集。
    evidence:
      - emonlens-server/src/test/java/io/emonlens/server/EvaluationRuleFlowTest.java
      - emonlens-server/sql/migrations/2026-11-11-eval-rule-v2.sql
      - docs/EmonLens评测增强功能使用指南.md
    depends_on: []

  - id: r2-2-feedback
    title: 端用户反馈采集（presigned token + score 类型学）
    status: completed
    goal: emonlens-eval-platform
    milestone: r2-online
    required: true
    priority: P1
    summary: >-
      预签 token 只授予「给指定 trace 写一条反馈」：库中只存 sha256、可限次数/过期/吊销、按 token 限流；
      四类 score（numeric/categorical/boolean/correction）归一后同时写 et_eval_result，既有监控与质量视图直接可用；
      负反馈跨阈值产生一条 Finding；correction 可一键收录为数据集样本并走样本契约校验。
    acceptance:
      - token 泄露场景只能写分数不能读正文
      - correction 类反馈进数据集时走样本契约校验
    next_action: >-
      进入 R2-3 评估器质量看板；同时把 R2-2 的两处已知偏差记入后续项（自定义分类标签体系、多实例共享限流）。
    evidence:
      - emonlens-server/src/test/java/io/emonlens/server/EndUserFeedbackFlowTest.java
      - emonlens-server/sql/migrations/2026-11-12-end-user-feedback.sql
      - docs/EmonLens评测增强功能使用指南.md
    depends_on: []

  - id: r2-3-quality-board
    title: 评估器质量看板（校准一致率 / UNKNOWN 率 / 缓存与成本）
    status: completed
    goal: emonlens-eval-platform
    milestone: r2-online
    required: false
    priority: P2
    summary: >-
      一次报告回答两问：leastTrusted 评估器（LOW_TRUST / NOISY / COSTLY 判定 + 可解释建议），
      与数据集腐烂（陈旧样本占比 + revision 年龄 → ROTTING / WARNING）。盲审一致率、UNKNOWN/未执行率、
      成本（缺价目 priced=false）、缓存汇总都可查；扫描把结论写成 EVALUATOR_QUALITY / DATASET_ROT Finding
      接入 Alerts，24 小时内同一对象只报一次。
    acceptance:
      - 能回答哪个评估器最不可信、哪个数据集在腐烂
    next_action: 进入 R2-4 实验对比增强（散点、repetitions 方差、leaderboard 降权）。
    evidence:
      - emonlens-server/src/test/java/io/emonlens/server/EvaluatorQualityFlowTest.java
      - emonlens-ui/src/views/trust/EvaluatorQualityView.vue
      - docs/EmonLens评测增强功能使用指南.md
    depends_on: []

  - id: r2-4-compare
    title: 实验对比增强（散点、repetitions 方差、leaderboard）
    status: completed
    goal: emonlens-eval-platform
    milestone: r2-online
    required: false
    priority: P2
    summary: >-
      散点按 run 给出 passRate/coverage/cost/priced/avgLatency 并可按模型与覆盖率过滤；repetitions 以候选指纹
      分组（复跑沿用冻结配置与指纹），报告均值/样本方差/标准差；leaderboard 用
      adjustedPassRate = 平均通过率 × 平均覆盖率 排序，覆盖率不足显式 degraded 并写明原因与 rankingRule；
      成对比较要求两组重复次数一致，否则 400。
    acceptance:
      - leaderboard 排序口径可解释，覆盖率不足的 run 显式降权
    next_action: 进入 R3-2 安全评测包（领域包扩展攻击种子集 + securityFail=0 红线）。
    evidence:
      - emonlens-server/src/test/java/io/emonlens/server/ExperimentInsightFlowTest.java
      - emonlens-ui/src/views/trust/ExperimentLeaderboardView.vue
      - docs/EmonLens评测增强功能使用指南.md
    depends_on: []

  - id: r3-1-conversation-sim
    title: 多轮会话仿真（REPLAY_SIM，persona + 停止条件）
    status: ready
    goal: emonlens-eval-platform
    milestone: r3-agent
    required: true
    priority: P1
    summary: >-
      新 run 模式 REPLAY_SIM：平台按 persona 与场景生成模拟用户轮次，被测 Agent 通过 HTTP 端点或 SDK runner
      接入；复用样本契约 v2 的 turns 与对话类预设评估器；停止条件为最大轮数/目标达成/persona 满意度；
      预算与缓存沿用，成本按 generation / simulation / judge 三相核算。
    acceptance:
      - 仿真会话完整入 trace 体系（可观测可回放）
      - 成本核算分 generation / simulation / judge 三相
    next_action: 先落 persona 与停止条件的 spec，再实现 REPLAY_SIM 轮次驱动与三相成本
    depends_on: []

  - id: r3-3-judge-upgrade
    title: Judge 技术升级（CoT / few-shot 校准样本 / 多 judge 聚合）
    status: planned
    goal: emonlens-eval-platform
    milestone: r3-agent
    required: false
    priority: P2
    summary: >-
      HOLISTIC 模板补 CoT（先列证据再打分）；从盲审校准一致样本里自动选 few-shot 示例注入 judge prompt；
      单评估器可配 2–3 个 judge 模型与聚合策略（majority/mean/保守），冲突时按策略出 UNKNOWN 而非硬判；
      judge 原始请求/响应留痕进任务账本。
    acceptance:
      - few-shot 开启后同一批样本重跑一致率不降（回归守护）
      - 多 judge 冲突时按策略出 UNKNOWN 而非硬判
    next_action: 先做 CoT 模板与 few-shot 注入（复用盲审一致样本），再做多 judge 聚合与原文留痕
    depends_on: []

  - id: r3-4-multimodal
    title: 多模态评测（图片附件，可延后）
    status: planned
    goal: emonlens-eval-platform
    milestone: r3-agent
    required: false
    priority: P3
    summary: >-
      样本契约 v2 增附件字段（image URL / base64，走对象存储与 TRACE_CONTENT 权限）；judge 模板证据字段支持图片
      （端点需 vision 模型）；TRAJECTORY 不涉及。
    acceptance:
      - 附件生命周期与导出脱敏口径与正文一致
    next_action: 视需求启动；先定附件存储与权限口径，再接 judge 证据字段
    depends_on: []

  - id: r3-2-security-pack
    title: 安全评测包接入 Gate（security 维度证据）
    status: completed
    goal: emonlens-eval-platform
    milestone: r3-agent
    required: true
    priority: P1
    summary: >-
      内置 7 类攻击种子（注入/越狱/PII/工具滥用/越权/不安全输出/跨租户泄漏）并按 OWASP LLM Top 10 映射；
      种子导入按 sha256 幂等，样本按 security:<CATEGORY> 打标；run 的 security 证据按类别与 OWASP 汇总并单独给功能通过率；
      Gate 新增 SECURITY_REDLINE：违例或证据不足直接 BLOCKED，且安全 BLOCKED 优先于普通 FAIL 聚合。
    acceptance:
      - 一次 run 能同时输出功能 Gate 与 security 维度证据
      - 红线违例即使整体通过率 100% 也判 BLOCKED
    next_action: 进入 R3-1 多轮会话仿真（persona 驱动、停止条件、复用 push 通道；成本分 generation/simulation/judge）。
    evidence:
      - emonlens-server/src/test/java/io/emonlens/server/SecurityPackFlowTest.java
      - emonlens-server/src/main/java/io/emonlens/server/engine/security/SecurityPackRegistry.java
      - docs/EmonLens评测增强功能使用指南.md
    depends_on: []
